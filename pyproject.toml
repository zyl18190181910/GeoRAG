[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-rag-eval"
version = "0.1.0"
description = "A geology knowledge-base RAG service with deterministic evaluation and API tests."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "openai>=2,<3",
  "pypdf>=5,<7",
  "python-multipart>=0.0.9,<1.0",
  "sentence-transformers>=5.1,<5.3",
  "transformers>=4.45,<5",
  "huggingface-hub>=0.24,<1",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
]

[tool.setuptools.packages.find]
include = ["geo_rag*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

